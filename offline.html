<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Graktor</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #111318;
    color: #e6e8ec;
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
  }
  .card { text-align: center; max-width: 380px; padding: 2rem; }
  h1 { font-size: 1.4rem; margin-bottom: 0.5rem; }
  p { color: #9aa1ad; line-height: 1.5; }
  button {
    margin-top: 1.25rem;
    padding: 0.6rem 1.4rem;
    border-radius: 8px;
    border: none;
    background: #4c6fff;
    color: white;
    font-size: 0.95rem;
    cursor: pointer;
  }
  button:hover { background: #3c5ce0; }
</style>
</head>
<body>
  <div class="card">
    <h1>Can't reach Graktor right now</h1>
    <p>Check this device's internet connection, then try again. Anything already rung up offline at the till is safe and will sync automatically once connected.</p>
    <button onclick="location.href='https://app.zendoriaventures.com'">Retry</button>
  </div>
</body>
</html>
